name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm install -g pnpm@12.21.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build

  docker:
    name: Docker smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: bash scripts/docker-smoke.sh

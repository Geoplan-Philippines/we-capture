name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Do not interrupt a deployment halfway through a Compose update.
concurrency:
  group: wecapture-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          # pnpm isn't installed yet at this point; skip the automatic cache.
          package-manager-cache: false
      - run: npm install -g pnpm@12.21.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build

  docker:
    name: Docker smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: bash scripts/docker-smoke.sh

  publish:
    name: Build and push image
    needs: [build, docker]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push We-Capture
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            geoplanoperation/wecapture:latest
            geoplanoperation/wecapture:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VPS
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE_TAG: sha-${{ github.sha }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          envs: IMAGE_TAG
          script: |
            set -eu
            cd "$HOME/docker-apps/wecapture-docker"
            # Deploy the exact tested commit, not a mutable latest tag.
            export TAG="$IMAGE_TAG"
            docker compose config --quiet
            docker compose pull wecapture
            if ! docker compose up -d --no-deps --force-recreate --wait --wait-timeout 120 wecapture; then
              docker compose ps
              docker compose logs --tail 100 wecapture
              exit 1
            fi
            echo "Deployed geoplanoperation/wecapture:$TAG"
            # Remove dangling images only; keep tagged rollback images and all volumes.
            echo "Pruning dangling Docker images..."
            docker image prune -f
